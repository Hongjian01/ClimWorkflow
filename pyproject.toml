[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openharness-ai"
version = "0.1.9"
description = "Open-source Python port of Claude Code - an AI-powered CLI coding assistant"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "novix-science" },
]

dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "textual>=0.80.0",
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "mcp>=1.0.0,<2",
    "pyperclip>=1.9.0",
    "pyyaml>=6.0",
    "questionary>=2.0.1",
    "watchfiles>=0.20.0",
    "croniter>=2.0.0",
    "slack-sdk>=3.0.0",
    "python-telegram-bot>=21.0.0",
    "discord.py>=2.0.0",
    "lark-oapi>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pexpect>=4.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "matplotlib>=3.7.0",
    "netCDF4>=1.7.4",
    "eccodes>=2.48.0",
    # PyPI 先上传 Windows wheel，index metadata 不含 eccodeslib；uv 在 Linux/macOS
    # 不会自动拉原生库，import 时抛 RuntimeError: Cannot find the ecCodes library。
    "eccodeslib>=2.48.0; sys_platform != 'win32'",
]
plot = [
    "matplotlib>=3.7.0",
]
climate = [
    "netCDF4>=1.7.4",
    "eccodes>=2.48.0",
    "eccodeslib>=2.48.0; sys_platform != 'win32'",
    "cdsapi>=0.7.7",
]

[project.scripts]
openharness = "openharness.cli:app"
oh = "openharness.cli:app"
openh = "openharness.cli:app"
ohmo = "ohmo.cli:app"
climworkflow = "openharness.climate.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/openharness", "ohmo"]

[tool.hatch.build]
exclude = [
    "/.git",
    "/.venv",
    "/.openharness-venv",
    "/.openharness",
    "/.pytest_cache",
    "/.mypy_cache",
    "/.ruff_cache",
    "/build",
    "/dist",
]

[tool.hatch.build.targets.wheel.force-include]
"frontend/terminal/package.json" = "openharness/_frontend/package.json"
"frontend/terminal/tsconfig.json" = "openharness/_frontend/tsconfig.json"
"frontend/terminal/src" = "openharness/_frontend/src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "climate_integration: 真实 CDS/网络集成测试；默认跳过。需 CLIMATE_INTEGRATION=1 且凭证可用；不得把凭证或路径写入日志。",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# 钉死 0.15 历史默认集，避免 Ruff 0.16 把默认规则扩到 413 条后 CI 误红。
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
strict = true

# netCDF4 1.7.4 在 win32+ARM64 上声明 numpy>=2.3，而 numpy 2.3+ 需要 Python 3.11+，
# 与仓库 requires-python>=3.10 的通用解析冲突。CI 为 Ubuntu x86_64；本机开发为
# Windows AMD64。不承诺 Windows ARM64。
[tool.uv]
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
